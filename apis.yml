name: Gowalla
description: 'Gowalla is a location-based social check-in application that lets people keep up with their
  friends in the real world by checking in at places, sharing their location, and collecting stamps and
  passport-style travel memories. Originally launched in 2007 as a pioneering location-based social game,
  Gowalla was acquired by Facebook in 2011 and wound down in 2012, then relaunched by founder Josh Williams
  in March 2023 as an iOS app before active development was paused in April 2023. The app remains available
  on the App Store and continues to operate on a limited basis, recruiting early testers through its Street
  Team program. Gowalla historically published a Check-In API with OAuth 2 support (2010), but no public
  developer API, SDK, or documentation is available today. This profile was surfaced as a portfolio company
  of GV (Google Ventures) and added to the API Evangelist network as a consumer-sector lead.'
